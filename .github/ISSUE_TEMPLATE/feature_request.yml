name: 功能请求
description: 说明使用中遇到的困难，以及希望 NextVol 提供的能力。
title: "[Feature] "
labels:
  - enhancement

body:
  - type: markdown
    attributes:
      value: |
        请先搜索[已有 issue](https://github.com/Renakoni/nextvol/issues)，相同需求请补充到原 issue。
        标题概括希望获得的能力，例如“查看整本书的离线下载完成情况”。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 在什么场景需要这个功能？目前哪里受阻，为什么现有能力不能满足需要？
      placeholder: 离线前想确认整本书是否已下载完成，目前需要逐卷检查。
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: 期望能力
      description: 希望用户最终能完成什么操作、获得什么结果？可以只描述目标，不必提供界面设计或实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案（可选）
      description: 描述设想的入口、交互或处理方式；尚未确定的选择可作为待讨论问题提出。

  - type: textarea
    id: examples
    attributes:
      label: 场景示例／完成表现（可选）
      description: 给一个具体使用例子，说明怎样才满足需求。维护者可据此整理验收标准。

  - type: textarea
    id: context
    attributes:
      label: 替代方式与相关资料（可选）
      description: 可补充当前绕行方式、类似产品参考、截图，以及相关 issue。
