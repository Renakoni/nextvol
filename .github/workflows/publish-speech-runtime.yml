name: Publish speech runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/sovits/**'
      - 'native/matcha/sovits*'
      - 'native/matcha/qnn_session.cpp'
      - 'native/matcha/build_android.py'
      - '.github/workflows/publish-speech-runtime.yml'

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-environment
      - name: Package GPT-SoVITS
        run: ./gradlew --no-daemon :app:prepareSpeechRuntimeCatalog --console=plain --max-workers=2
      - name: Publish component
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-speech-runtime.sh
