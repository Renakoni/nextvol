name: Android checks 1/4 - JVM

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-jvm-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select affected checks
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          check: jvm
      - name: Check CI task selection
        run: python3 .github/scripts/test_ci_scope.py
      - name: Prepare fixed Android environment
        if: steps.scope.outputs.run == 'true'
        id: environment
        uses: ./.github/actions/android-environment
        with:
          native-tools: 'false'
      - name: Restore shared Robolectric SDKs
        if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/robolectric
      - name: Check emulator preparation and failure handling
        if: steps.scope.outputs.scopes == 'full'
        run: |
          python3 .github/scripts/test_emulator_tests.py
          python3 .github/scripts/test_ci_emulator.py
          python3 .github/scripts/test_prepare_android_sdk.py
          python3 .github/scripts/test_ci_debug_apks.py
          python3 .github/scripts/test_ci_cache.py
          python3 native/onnxruntime/test_verify_sources.py
          python3 native/onnxruntime/test_build_cache.py
      - name: Run JVM unit tests
        if: steps.scope.outputs.run == 'true'
        env:
          GRADLE_TASKS: ${{ steps.scope.outputs.gradle-args }}
        run: |
          read -r -a tasks <<< "$GRADLE_TASKS"
          # Host JVM tests cannot load the Android ARM64 library; APK jobs build it.
          ./gradlew --no-daemon "${tasks[@]}" -x :app:buildMatchaNative --console=plain --stacktrace --max-workers=2
      - name: Upload test reports
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            app/hs_err_pid*.log
            app/replay_pid*.log
            epub/build/reports/tests/test
            epub/build/test-results/test
            sources/rules/build/reports/tests/test
            sources/rules/build/test-results/test
            sources/network/build/reports/tests/test
            sources/network/build/test-results/test
            sources/execution/build/reports/tests/test
            sources/execution/build/test-results/test
            sources/import/build/reports/tests/test
            sources/import/build/test-results/test
            tests/source-compatibility/build/reports/tests/test
            tests/source-compatibility/build/test-results/test
            tests/source-compatibility/build/reports/source-compatibility
            sources/rhino/build/reports/tests/test
            sources/content/build/test-results/test
            sources/content/build/reports/tests/test
            sources/rhino/build/test-results/test
            sources/speech/build/test-results/test
            sources/speech/build/reports/tests/test
          if-no-files-found: ignore
