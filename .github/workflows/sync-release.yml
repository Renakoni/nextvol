name: Sync formal app release to Nextvol api

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published app or GPT component tag
        required: true
        type: string

permissions:
  contents: read

# One writer protects stable.json from concurrent releases or manual backfills.
concurrency:
  group: ${{ startsWith(inputs.tag || github.event.release.tag_name, 'offline-runtime-sovits-') && format('nextvol-component-{0}', inputs.tag || github.event.release.tag_name) || 'nextvol-stable-release-sync' }}
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'Renakoni/nextvol' &&
      (github.event_name == 'release' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'release' ||
       (!github.event.release.draft &&
        ((!github.event.release.prerelease && startsWith(github.event.release.tag_name, 'v')) ||
         (github.event.release.prerelease && startsWith(github.event.release.tag_name, 'offline-runtime-sovits-')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare APK verification tools
        if: startsWith(inputs.tag || github.event.release.tag_name, 'v')
        run: |
          tools="$ANDROID_HOME/build-tools/36.0.0"
          if [[ ! -x "$tools/apksigner" || ! -x "$tools/aapt2" ]]; then
            sdkmanager 'build-tools;36.0.0' > /dev/null
          fi
      - name: Install R2 S3 client
        run: python3 -m pip install 'boto3==1.40.61'
      - name: Synchronize the published artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: >-
          python3 .github/scripts/sync_release.py --tag "$RELEASE_TAG"
          --android-tools "$ANDROID_HOME/build-tools/36.0.0"
