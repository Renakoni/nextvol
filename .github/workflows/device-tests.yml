name: Android checks 2/4 - Devices

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-device-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  execution-platform:
    name: Isolated execution (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [24, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select affected checks
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          check: device-${{ matrix.api }}
      - name: Prepare fixed Android environment
        if: steps.scope.outputs.run == 'true'
        id: environment
        uses: ./.github/actions/android-environment
        with:
          api: ${{ matrix.api }}
      - name: Enable KVM
        if: steps.scope.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build test APKs before starting the emulator
        if: steps.scope.outputs.run == 'true'
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --console=plain --stacktrace --max-workers=2
      - name: Run tests on the fixed Android emulator
        if: steps.scope.outputs.run == 'true'
        env:
          API_LEVEL: ${{ matrix.api }}
          CI_TEST_SCOPES: ${{ steps.scope.outputs.device-scopes }}
        run: |
          bash .github/scripts/run-static-emulator.sh "$API_LEVEL" \
            bash .github/scripts/emulator-tests.sh bash .github/scripts/connected-tests.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: execution-platform-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
            app/build/reports/emulator-diagnostics
          if-no-files-found: ignore
