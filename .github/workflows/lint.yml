name: Android checks 4/4 - Lint

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lint-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select affected checks
        id: scope
        uses: ./.github/actions/ci-scope
        with:
          check: lint
      - name: Prepare fixed Android environment
        if: steps.scope.outputs.run == 'true'
        id: environment
        uses: ./.github/actions/android-environment
        with:
          native-tools: 'false'
      - name: Check resource contracts
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p build/reports/lint
          python3 .github/scripts/test_check_resources.py 2>&1 | tee build/reports/lint/resource-tests.log
          python3 .github/scripts/check_resources.py 2>&1 | tee build/reports/lint/resources.log
      - name: Run full Debug Lint and production Release fatal checks
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        shell: bash
        run: |
          mkdir -p build/reports/lint
          # Lint analyzes Kotlin/resources; native packaging remains checked by APK builds.
          ./gradlew --no-daemon :app:lintDebug :app:lintVitalRelease -x :app:buildMatchaNative --continue --console=plain --stacktrace --max-workers=2 2>&1 | tee build/reports/lint/gradle.log
      - name: Upload Lint reports
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug
            app/build/intermediates/lint_vital_intermediate_text_report/release/lintVitalReportRelease
            build/reports/lint
          if-no-files-found: warn
