name: Release sync checks

on:
  pull_request:
    paths:
      - '.github/scripts/sync_release.py'
      - '.github/scripts/test_sync_release.py'
      - '.github/workflows/sync-release*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 -m pip install 'boto3==1.40.61'
      - run: python3 .github/scripts/test_sync_release.py
