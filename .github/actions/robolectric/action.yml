name: Shared Robolectric SDKs
description: Main publishes fixed Android runtime jars; PRs only restore them
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/repository/org/robolectric
        key: robolectric-linux-4.16.1-i7-v2-${{ hashFiles('.github/scripts/prepare-robolectric.sh') }}
    - name: Prepare shared Android runtime jars without running tests
      if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: bash .github/scripts/prepare-robolectric.sh
    - name: Save shared Robolectric SDKs
      if: github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.m2/repository/org/robolectric
        key: ${{ steps.restore.outputs.cache-primary-key }}
