name: Matcha source toolchain
description: Fixed tools for the native backend included in ordinary APKs
runs:
  using: composite
  steps:
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: tools
      with:
        path: ${{ runner.temp }}/matcha-toolchain
        key: matcha-linux-ndk28c-cmake3.31.6-ninja1.13.0-v1
    - name: Prepare native tools
      shell: bash
      run: |
        set -euo pipefail
        tools="$RUNNER_TEMP/matcha-toolchain"
        mkdir -p "$tools"
        if [[ ! -f "$tools/android-ndk-r28c/source.properties" ]]; then
          curl --fail --location --retry 2 https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o "$tools/ndk.zip"
          unzip -q "$tools/ndk.zip" -d "$tools"
          rm "$tools/ndk.zip"
        fi
        if [[ ! -x "$tools/python/cmake/data/bin/cmake" || ! -x "$tools/python/bin/ninja" ]]; then
          python3 -m pip install --disable-pip-version-check --no-deps --upgrade --target "$tools/python" cmake==3.31.6 ninja==1.13.0
        fi
        "$tools/python/cmake/data/bin/cmake" --version
        "$tools/python/bin/ninja" --version
        cat >> "$GITHUB_ENV" <<EOF
        ORG_GRADLE_PROJECT_matchaNdk=$tools/android-ndk-r28c
        ORG_GRADLE_PROJECT_matchaCmake=$tools/python/cmake/data/bin/cmake
        ORG_GRADLE_PROJECT_matchaNinja=$tools/python/bin/ninja
        EOF
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: github.ref == 'refs/heads/main' && steps.tools.outputs.cache-hit != 'true'
      with:
        path: ${{ runner.temp }}/matcha-toolchain
        key: ${{ steps.tools.outputs.cache-primary-key }}
    - name: Identify the ONNX Runtime build inputs
      id: runtime
      shell: bash
      env:
        ORT_INPUTS: ${{ hashFiles('native/onnxruntime/vendor/**', 'native/onnxruntime/sources.sha256', 'native/onnxruntime/sources.json', 'native/onnxruntime/cmake/**', 'native/onnxruntime/build_android.py', 'native/onnxruntime/verify_sources.py', '.github/actions/matcha-toolchain/action.yml') }}
      run: |
        set -euo pipefail
        test -n "$ORT_INPUTS"
        # Identify protoc's actual host tools instead of the whole runner image.
        # Unrelated image updates must not rebuild the fixed Android runtime.
        export LC_ALL=C
        host_versions="$("${CC:-cc}" --version)"
        host_versions+=$'\n'"$("${CXX:-c++}" --version)"
        host_linker="$("${CXX:-c++}" -print-prog-name=ld)"
        host_versions+=$'\n'"$("$host_linker" --version)"
        host_tools="$(printf '%s\n' "$host_versions" | sha256sum | cut -d ' ' -f1)"
        printf '%s\n' "$host_versions"
        key="onnxruntime-linux-v2-${ImageOS:?}-$host_tools-$ORT_INPUTS"
        echo "ONNX Runtime cache key: $key"
        echo "key=$key" >> "$GITHUB_OUTPUT"
        echo "ORG_GRADLE_PROJECT_matchaOrtCacheKey=$key" >> "$GITHUB_ENV"
    - name: Restore and save the source-built ONNX Runtime install
      id: ort
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: app/build/matcha/onnxruntime/install
        # Exact inputs only. GitHub isolates PR writes from the shared main cache.
        key: ${{ steps.runtime.outputs.key }}
    - name: Populate a missing shared ONNX Runtime install
      if: github.ref == 'refs/heads/main' && steps.ort.outputs.cache-hit != 'true'
      shell: bash
      # Gradle can restore Matcha's final outputs without recreating ORT's install.
      # Repair main's shared install even when that task will be FROM-CACHE.
      run: |
        python3 native/onnxruntime/build_android.py \
          --ndk "$ORG_GRADLE_PROJECT_matchaNdk" \
          --cmake "$ORG_GRADLE_PROJECT_matchaCmake" \
          --ninja "$ORG_GRADLE_PROJECT_matchaNinja" \
          --output app/build/matcha/onnxruntime --jobs 3 \
          --cache-key "$ORG_GRADLE_PROJECT_matchaOrtCacheKey"
