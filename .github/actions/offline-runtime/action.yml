name: Shared embedded offline SDK
description: Verify and extract the pinned SDK ZIP; main publishes one shared archive
runs:
  using: composite
  steps:
    - id: archive
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/offline-sdk/runtime.zip
        key: offline-sdk-v1-${{ hashFiles('native/offline/runtime.json') }}
    - name: Prepare the verified SDK for APK packaging
      shell: bash
      run: |
        python3 native/offline/fetch_runtime.py \
          --archive "$RUNNER_TEMP/offline-sdk/runtime.zip" \
          --output "$GITHUB_WORKSPACE/app/build/offline-runtime"
        echo "ORG_GRADLE_PROJECT_offlineRuntimeDir=$GITHUB_WORKSPACE/app/build/offline-runtime" >> "$GITHUB_ENV"
    - name: Save the shared SDK archive
      if: github.ref == 'refs/heads/main' && steps.archive.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/offline-sdk/runtime.zip
        key: ${{ steps.archive.outputs.cache-primary-key }}
